<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paws United business card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Nunito:wght@500;600;700&display=swap">
<style>
@page{size:3.75in 2.25in;margin:0}
html,body{margin:0;background:#0F1A14}
body{font-family:"Nunito",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{width:3.75in;height:2.25in;position:relative;overflow:hidden;page-break-after:always;background:#0F1A14;color:#F1F5EC}
/* ---------- FRONT: the splash scene, printed ---------- */
.front{background:radial-gradient(80% 60% at 50% 80%,rgba(234,196,106,.22),transparent 60%),radial-gradient(70% 60% at 50% 30%,#17281E,#0F1A14 70%)}
.front .scene{z-index:1;position:absolute;left:50%;bottom:.62in;width:4.6in;height:auto;transform:translateX(-50%)}
.front .verge{z-index:2;position:absolute;left:-.2in;right:-.2in;bottom:.60in;height:.14in;background:url(../img/grass-back.png) repeat-x center bottom/auto .14in;opacity:.85}
.front .walk{z-index:2;position:absolute;left:-.2in;right:-.2in;bottom:.40in;height:.22in}
.front .walk .top{height:.12in;background:repeating-linear-gradient(90deg,#3F4F43 0 .5in,#2A3A30 .5in .52in);transform:perspective(1.2in) rotateX(60deg);transform-origin:50% 100%;border-top:1px solid rgba(169,207,166,.25)}
.front .walk .face{height:.10in;background:linear-gradient(#2E4034,#1E2C24);border-top:1.2pt solid rgba(234,196,106,.8);box-shadow:0 0 10pt rgba(234,196,106,.3)}
.front .fgrass{z-index:4;position:absolute;left:-.2in;right:-.2in;bottom:.12in;height:.32in;background:url(../img/grass-front.png) repeat-x 30% top/auto .32in;opacity:.75;-webkit-mask-image:linear-gradient(#000 30%,transparent 90%);mask-image:linear-gradient(#000 30%,transparent 90%)}
.front .dogw{position:absolute;left:.22in;bottom:.55in;width:1.05in;z-index:3;filter:drop-shadow(0 0 8pt rgba(234,196,106,.45))}
.front .dogw svg{width:100%;height:auto;display:block}
.front .paws{z-index:3;position:absolute;left:.16in;bottom:.62in;display:flex;gap:.06in;opacity:.7}
.front .paws svg{width:.09in;height:.09in;fill:#EAC46A}
.front .paws svg:nth-child(even){transform:translateY(-.03in) rotate(10deg)}
.front .name{z-index:6;position:absolute;left:0;right:0;top:.30in;text-align:center;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:26pt;letter-spacing:-.03em;line-height:1;background:linear-gradient(100deg,#F1F5EC 0%,#EAC46A 45%,#FFF3C4 55%,#EAC46A 65%,#A9CFA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6pt rgba(234,196,106,.35))}
.front .rule{z-index:6;position:absolute;left:50%;top:.72in;width:1.5in;height:1.2pt;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#EAC46A,transparent)}
.front .sub{z-index:6;position:absolute;left:0;right:0;top:.80in;text-align:center;font-weight:700;font-size:6.8pt;letter-spacing:.18em;text-transform:uppercase;color:#A9CFA6}
.front .moonglow{position:absolute;right:.35in;top:.22in;width:.5in;height:.5in;border-radius:50%;background:radial-gradient(circle,rgba(234,196,106,.35),transparent 70%)}
/* ---------- BACK: contact + QR ---------- */
.back{background:linear-gradient(160deg,#15231B,#0F1A14)}
.back .pattern{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 10px 10px,#A9CFA6 1.2px,transparent 1.6px);background-size:22px 22px}
.back .stripe{position:absolute;left:0;top:0;bottom:0;width:.1in;background:linear-gradient(#A9CFA6,#EAC46A)}
.back .badge{position:absolute;left:.32in;top:.25in;width:.5in;height:.5in}
.back .badge svg{width:100%;height:100%;display:block}
.back .who{position:absolute;left:.92in;top:.27in;width:1.5in;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:11.5pt;letter-spacing:-.01em;color:#F1F5EC;line-height:1.05}
.back .role{position:absolute;left:.92in;top:.52in;width:1.5in;font-weight:700;font-size:6.2pt;letter-spacing:.14em;text-transform:uppercase;color:#EAC46A}
.back ul{position:absolute;left:.32in;top:.95in;list-style:none;margin:0;padding:0;display:grid;gap:4pt;font-size:8pt;font-weight:600;color:#DCE7DD}
.back li{display:flex;align-items:center;gap:6pt}
.back li i{width:.19in;height:.19in;border-radius:50%;background:rgba(169,207,166,.16);display:grid;place-items:center;flex:none}
.back li i svg{width:.11in;height:.11in;fill:none;stroke:#A9CFA6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back .qr{position:absolute;right:.28in;top:.30in;width:.8in;height:.8in;padding:.06in;background:#F1F5EC;border-radius:8pt;box-shadow:0 0 0 2pt #EAC46A,0 0 14pt rgba(234,196,106,.35)}
.back .qr svg{width:100%;height:100%;display:block}
.back .scan{position:absolute;right:.28in;top:1.27in;width:.92in;text-align:center;font-size:6.2pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#EAC46A}
.back .svc{position:absolute;left:.32in;right:.30in;bottom:.22in;font-size:6.2pt;color:#8FA595;font-weight:600;letter-spacing:.02em;border-top:1pt solid rgba(234,196,106,.35);padding-top:4pt}
.ph{background:#3A3210;color:#F2DC8F;padding:0 .2em;border-radius:2pt}
